name: Tests

# ── What this is for ─────────────────────────────────────────────────────────
# Two different questions, and they need different jobs.
#
#   "Is the logic right?"  — the PHPUnit suite, which runs against a stubbed
#                            WordPress and is fast enough to run on every push.
#
#   "Does it actually run?" — the integration scripts, against a real database
#                            and a real WP_REST_Server under wp-env.
#
# And one question that is easy to answer wrongly by never asking it: does this
# plugin work on the PHP version its own header promises? The header says 7.4.
# PHPUnit 11 requires 8.2, so the unit suite CANNOT run on 7.4 — which means
# without the `php74` job below, the compatibility claim would be tested by
# nobody, ever. That job is the reason this file exists in the shape it does.

on:
  # CI runs locally now, not here. The `push` and `pull_request` triggers were
  # removed deliberately — every check below still exists and still works, it is
  # just started by hand from the Actions tab (or with `gh workflow run`) rather
  # than by a commit. The local recipes are in CLAUDE.md and README.md.
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch cancels the first. These jobs take minutes
# and nobody is waiting on the results of a commit that has been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Parses on PHP 7.4
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      # Only what ships. tests/ is excluded by .distignore and never reaches a
      # site, so it is free to use anything the test runner supports.
      - name: Lint every shipping file
        run: |
          status=0
          files=$(find . -name '*.php' -not -path './tests/*' -not -path './.git/*')
          for file in $files; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Does not parse on PHP 7.4"
              php -l "$file" || true
              status=1
            fi
          done
          echo "Checked $(echo "$files" | wc -l) files."
          exit $status

  # The one hand-written script with logic worth checking. It renumbers cloned
  # rows in the event grid, and the first version of its patterns matched
  # nothing while still looking correct on screen — the field names came out
  # right, so a cloned row saved perfectly and only the labels were wrong.
  js:
    name: The grid's row cloning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - run: node tests/js/renumber.test.mjs

  # This repository carries around 126 phpcs:ignore annotations, each with a
  # written justification, and until this job existed nothing verified that any
  # of them still silenced something real. An annotation outlives the code it was
  # written for silently — the only signal that it has stopped being true is a
  # sniff that no longer fires, and nothing was running the sniffs.
  #
  # Composer here is a linter and nothing else. It installs no runtime
  # dependency, the plugin loads no autoloader, and composer.json, composer.lock
  # and vendor/ are all in .distignore, so none of it reaches the zip. PHPUnit is
  # deliberately NOT a Composer dependency: the suite is fetched as a phar by the
  # unit job below, which is the workflow this repo already had and which works.
  standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install the linter
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCS
        run: composer run lint

      # php -l proves the source parses on 7.4. It cannot prove the source only
      # calls what 7.4 has — a PHP 8 function parses perfectly on 7.4 and fails
      # at runtime, on the shared hosting this plugin is actually installed on.
      - name: Check the source really runs on 7.4
        run: composer run compat

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Fetched rather than committed, the same way a developer runs it. There
      # is no Composer in this plugin and the suite does not introduce one.
      - name: Fetch PHPUnit
        run: curl -sSLO https://phar.phpunit.de/phpunit-11.phar

      - name: Run the suite
        run: php phpunit-11.phar

  integration:
    name: Integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor the plugin header promises; 8.3 is what a current
        # host runs. Both, because the interesting failures are at the ends.
        php: [ '7.4', '8.3' ]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # wp-env reads phpVersion from the config file, so the matrix writes one.
      # Ports are left at the defaults: nothing else is running on the runner.
      - name: Write a wp-env config for PHP ${{ matrix.php }}
        run: |
          cat > .wp-env.ci.json <<JSON
          {
            "core": null,
            "phpVersion": "${{ matrix.php }}",
            "plugins": [ "." ],
            "testsEnvironment": false,
            "config": {
              "WP_DEBUG": true,
              "WP_DEBUG_DISPLAY": true,
              "SCRIPT_DEBUG": true
            }
          }
          JSON

      - name: Start WordPress
        run: npx --yes @wordpress/env start --config=.wp-env.ci.json

      - name: Confirm the PHP version really is ${{ matrix.php }}
        run: |
          actual=$(npx --yes @wordpress/env run cli --config=.wp-env.ci.json -- php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;' 2>/dev/null | tr -d '\r' | tail -1)
          echo "Running on PHP $actual"
          case "$actual" in
            *"${{ matrix.php }}"*) ;;
            *) echo "::error::Expected PHP ${{ matrix.php }}, got $actual"; exit 1 ;;
          esac

      # Each script echoes PASS/FAIL per check, prints ALL PASS or a count, and
      # exits non-zero on any failure. Two signals decide it and both must
      # agree: a zero exit code AND the literal ALL PASS in the output.
      #
      # Both, because the exit code alone was not enough. Seven of these scripts
      # had no exit( 1 ) at all — dashboard-paging, entry-editing, and the five
      # event ones — so they printed their failure count and returned zero, and
      # this job read that as a pass. Six of the seven were the events suite,
      # the newest feature here. They all exit properly now; the marker check is
      # what keeps that true when somebody adds the twenty-first and forgets,
      # rather than trusting every future author to remember.
      #
      # Discovered from the filesystem rather than listed here. The list was
      # written out by hand until it had six names on it and the repository had
      # eleven scripts — so five milestones' worth of integration coverage
      # existed, passed locally, and was run by nobody. A job that silently
      # tests less than it appears to is worse than one that fails, because it
      # reports success either way.
      #
      # The count is asserted for the same reason: a glob that matches nothing
      # exits zero and looks exactly like a green run.
      - name: Run the integration scripts
        run: |
          status=0
          base=wp-content/plugins/groundwork-common-volunteer-tracker/tests/integration

          scripts=$(ls tests/integration/*.php | xargs -n1 basename | sed 's/\.php$//' | sort)
          found=$(echo "$scripts" | wc -l | tr -d ' ')

          echo "Found $found integration scripts."

          if [ "$found" -lt 6 ]; then
            echo "::error::Expected at least 6 integration scripts, found $found — the glob is wrong."
            exit 1
          fi

          for script in $scripts; do
            echo "── $script ────────────────────────────────────────────"
            if ! out=$(npx --yes @wordpress/env run cli --config=.wp-env.ci.json -- wp eval-file "$base/$script.php" 2>&1); then
              echo "$out"
              echo "::error::$script exited non-zero"
              status=1
              continue
            fi
            echo "$out"
            case "$out" in
              *"ALL PASS"*) ;;
              *) echo "::error::$script exited zero without printing ALL PASS"; status=1 ;;
            esac
          done
          exit $status

      - name: Stop WordPress
        if: always()
        run: npx --yes @wordpress/env stop --config=.wp-env.ci.json || true

  # The third question, after "is the logic right" and "does it actually run":
  # does a person get through it. Chromium against the wp-env site, driving the
  # real screens.
  #
  # It is here rather than only on somebody's laptop for the same reason every
  # other check is: a check that exists in one place is a check that stops being
  # run. It is heavier than the rest — a browser download and a booted site — and
  # nothing in this file runs automatically anyway, so the cost is paid only when
  # somebody asks for it.
  browser:
    name: Does a person get through it?
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # A current host's PHP. The 7.4 floor is a question about the source, and
      # `lint` and `integration` already ask it; this job is about the screens.
      - name: Write a wp-env config
        run: |
          cat > .wp-env.ci.json <<'JSON'
          {
            "core": null,
            "phpVersion": "8.3",
            "plugins": [ "." ],
            "testsEnvironment": false,
            "config": {
              "WP_DEBUG": true,
              "WP_DEBUG_DISPLAY": true,
              "SCRIPT_DEBUG": true
            }
          }
          JSON

      - name: Start WordPress
        run: npx --yes @wordpress/env start --config=.wp-env.ci.json

      - name: Install the harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # wp-env's default port, which is what the config above leaves it at.
      # bin/wpenv pins a different one for local work; the suite is pointed at
      # whichever it is told about rather than guessing.
      - name: Run the browser suite
        env:
          GWC_VT_E2E_URL: http://localhost:8888
        run: npm run test:e2e

      - name: Keep the traces from anything that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            tests/e2e/.report
            tests/e2e/.artifacts
          retention-days: 7

      - name: Stop WordPress
        if: always()
        run: npx --yes @wordpress/env stop --config=.wp-env.ci.json || true

  version:
    name: Version numbers agree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # VersionTest covers this too, but it runs in the unit job alongside
      # everything else. Failing it on its own says what is wrong without
      # anybody reading a stack trace: a release where the header and the
      # Stable tag disagree ships a version WordPress will not offer as an
      # update, and fixing it means another release.
      - name: Fetch PHPUnit
        run: curl -sSLO https://phar.phpunit.de/phpunit-11.phar

      - name: Check the four places a version lives
        run: php phpunit-11.phar --filter VersionTest
